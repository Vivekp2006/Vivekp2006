<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tech Snake | Vivek Kumar Prajapati</title>
<style>
  :root { color-scheme: dark; }
  body { margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px;
         background:#0d1117; color:#c9d1d9; font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif; text-align:center; }
  h1 { margin:0; font-size:22px; }
  h1 span { background:linear-gradient(90deg,#58a6ff,#a371f7,#3fb950); -webkit-background-clip:text; background-clip:text; color:transparent; }
  canvas { border:2px solid #30363d; border-radius:12px; max-width:94vw; height:auto; touch-action:none; background:#0d1117; }
  .bar { display:flex; gap:18px; font-family:'Courier New',monospace; font-size:15px; }
  .hint { font-size:13px; color:#8b949e; max-width:90vw; }
  a { color:#58a6ff; text-decoration:none; }
</style>
</head>
<body>
  <h1><span>Tech Snake</span></h1>
  <div class="bar"><div>Score: <b id="score">0</b></div><div>Best: <b id="best">0</b></div><div id="learned">Eat the tech stack</div></div>
  <canvas id="c" width="480" height="480"></canvas>
  <div class="hint">Arrow keys / WASD or swipe to move. Space or tap to start / restart.<br>
  Made by <a href="https://vivek.sqstudio.in">Vivek Kumar Prajapati</a> · <a href="https://github.com/Vivekp2006">GitHub</a></div>
<script>
(function () {
  var cv = document.getElementById('c'), ctx = cv.getContext('2d');
  var N = 20, S = 24;
  var techs = ['JavaScript','React','Node.js','Express','TypeScript','Vite','Python','MongoDB','PostgreSQL','MySQL','Supabase','OpenAI','LangChain','RAG','AWS','Google Cloud','Vercel','Git'];
  var snake, dir, next, food, score, timer, state = 'ready';
  var best = 0;
  try { best = parseInt(localStorage.getItem('techSnakeBest') || '0', 10) || 0; } catch (e) {}
  document.getElementById('best').textContent = best;

  function spawn() {
    while (true) {
      var f = { x: Math.floor(Math.random() * N), y: Math.floor(Math.random() * N), t: techs[Math.floor(Math.random() * techs.length)] };
      if (!snake.some(function (s) { return s.x === f.x && s.y === f.y; })) return f;
    }
  }
  function reset() {
    snake = [{ x: 8, y: 10 }, { x: 7, y: 10 }, { x: 6, y: 10 }];
    dir = { x: 1, y: 0 }; next = dir; score = 0;
    document.getElementById('score').textContent = 0;
    document.getElementById('learned').textContent = 'Eat the tech stack';
    food = spawn();
  }
  function speed() { return Math.max(60, 120 - score * 3); }
  function start() { reset(); state = 'run'; clearInterval(timer); timer = setInterval(tick, speed()); draw(); }
  function over() {
    state = 'over'; clearInterval(timer);
    if (score > best) { best = score; document.getElementById('best').textContent = best; try { localStorage.setItem('techSnakeBest', best); } catch (e) {} }
    draw();
  }
  function tick() {
    dir = next;
    var h = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
    if (h.x < 0 || h.y < 0 || h.x >= N || h.y >= N || snake.some(function (s) { return s.x === h.x && s.y === h.y; })) return over();
    snake.unshift(h);
    if (h.x === food.x && h.y === food.y) {
      score++; document.getElementById('score').textContent = score;
      document.getElementById('learned').textContent = 'Ate: ' + food.t;
      food = spawn(); clearInterval(timer); timer = setInterval(tick, speed());
    } else { snake.pop(); }
    draw();
  }
  function rr(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
  function draw() {
    ctx.fillStyle = '#0d1117'; ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.fillStyle = '#21262d';
    for (var i = 0; i < N; i++) for (var j = 0; j < N; j++) ctx.fillRect(i * S + S / 2 - 1, j * S + S / 2 - 1, 2, 2);
    if (food) {
      ctx.font = 'bold 11px Segoe UI, Arial, sans-serif';
      var w = ctx.measureText(food.t).width + 12, fx = Math.min(Math.max(food.x * S + S / 2 - w / 2, 2), cv.width - w - 2);
      ctx.fillStyle = '#a371f7'; rr(fx, food.y * S + 3, w, S - 6, 6); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(food.t, fx + w / 2, food.y * S + S / 2);
    }
    for (var k = snake.length - 1; k >= 0; k--) {
      var s = snake[k], t = k / Math.max(snake.length, 1);
      ctx.fillStyle = k === 0 ? '#3fb950' : 'rgb(' + Math.round(46 - 21 * t) + ',' + Math.round(160 - 52 * t) + ',' + Math.round(67 - 21 * t) + ')';
      rr(s.x * S + 2, s.y * S + 2, S - 4, S - 4, k === 0 ? 8 : 6); ctx.fill();
      if (k === 0) { ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(s.x * S + S / 2 + dir.x * 4 - dir.y * 5, s.y * S + S / 2 + dir.y * 4 + dir.x * 5, 2.5, 0, 7); ctx.arc(s.x * S + S / 2 + dir.x * 4 + dir.y * 5, s.y * S + S / 2 + dir.y * 4 - dir.x * 5, 2.5, 0, 7); ctx.fill(); }
    }
    if (state !== 'run') {
      ctx.fillStyle = 'rgba(13,17,23,.78)'; ctx.fillRect(0, 0, cv.width, cv.height);
      ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = 'bold 26px Segoe UI, Arial, sans-serif';
      ctx.fillText(state === 'over' ? 'Game Over  (' + score + ')' : 'Tech Snake', cv.width / 2, cv.height / 2 - 14);
      ctx.font = '15px Segoe UI, Arial, sans-serif'; ctx.fillStyle = '#8b949e';
      ctx.fillText('Press Space or tap to ' + (state === 'over' ? 'play again' : 'start'), cv.width / 2, cv.height / 2 + 20);
    }
  }
  function turn(x, y) { if (state === 'run' && !(x === -dir.x && y === -dir.y)) next = { x: x, y: y }; }
  window.addEventListener('keydown', function (e) {
    var k = e.key.toLowerCase();
    if (k === ' ' || k === 'enter') { e.preventDefault(); if (state !== 'run') start(); return; }
    var m = { arrowup: [0, -1], w: [0, -1], arrowdown: [0, 1], s: [0, 1], arrowleft: [-1, 0], a: [-1, 0], arrowright: [1, 0], d: [1, 0] }[k];
    if (m) { e.preventDefault(); turn(m[0], m[1]); }
  });
  var sx, sy;
  cv.addEventListener('touchstart', function (e) { sx = e.touches[0].clientX; sy = e.touches[0].clientY; if (state !== 'run') start(); }, { passive: true });
  cv.addEventListener('touchend', function (e) {
    var dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
    if (Math.abs(dx) > Math.abs(dy)) turn(dx > 0 ? 1 : -1, 0); else turn(0, dy > 0 ? 1 : -1);
  }, { passive: true });
  cv.addEventListener('click', function () { if (state !== 'run') start(); });
  reset(); draw();
})();
</script>
</body>
</html>
